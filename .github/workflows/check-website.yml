
name: Check website

on:
  workflow_dispatch:
  push:
    branches:
      - website-alignment

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4
        with:
          ref: website-alignment

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check Astro
        run: npm run check

      - name: Build website
        run: npm run build
