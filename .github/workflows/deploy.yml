name: Deploy Astro site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - website-alignment

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production website
        uses: actions/checkout@v4
        with:
          ref: build/wild-loop-expeditions-site
          path: production

      - name: Checkout preview website
        uses: actions/checkout@v4
        with:
          ref: website-alignment
          path: preview

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build production website
        working-directory: production
        run: |
          npm install
          npm run check
          npm run build

      - name: Prepare combined website
        run: |
          mkdir -p site
          cp -R production/dist/. site/

      - name: Build preview website
        working-directory: preview
        run: |
          npm install
          npm run check
          sed -i "s|base: '/wild-loop-expeditions'|base: '/wild-loop-expeditions/preview'|" astro.config.mjs
          npm run build

      - name: Add preview to website
        run: |
          mkdir -p site/preview
          cp -R preview/dist/. site/preview/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
